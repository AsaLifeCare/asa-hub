# TOP OF platform-assets/hub-nginx.conf (http level: the file is included inside http{}, beside the existing
# limit_req_zone lines).

# WebSocket upgrade for /chat-hub/ only; every other location keeps its own Connection "".
map $http_upgrade $hub_chat_conn { default upgrade; '' ''; }

# $uri carries no query string, so a ticket (?access_token=) never reaches the log; $request_time gives the
# real lifetime of a connection.
log_format hubchat '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=hub_chat:10m rate=5r/s;
# the ticket door's own bucket: a whole office behind one address reconnecting after a hub restart
limit_req_zone $binary_remote_addr zone=hub_chat_ticket:10m rate=5r/s;
