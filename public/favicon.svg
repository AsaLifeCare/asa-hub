  <text x="7.75" y="41" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#ffffff" textLength="40" lengthAdjust="spacingAndGlyphs">asa</text>
  <rect x="50.25" y="35" width="6" height="6" fill="#4cc4e2"/>
</svg>
