<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="asa.">
  <!-- navy detail-hero tile; hex allowed inside this static svg asset -->
  <rect width="64" height="64" rx="14" fill="#101828"/>
