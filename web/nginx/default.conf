# ASA Hub SPA — cache policy.
#
# The bundle filenames are content-hashed, so assets can be cached forever;
# index.html must NEVER be, or a browser keeps booting an old build after a
# release (the "I refreshed and nothing changed" trap that cost a whole test
# session on 31/07). HashRouter means every path serves index.html.

# /gas rides on a single Google account with a ~30 parallel-execution
# ceiling, and the relay itself is unauthenticated transport (auth lives in
# the envelope). Without a ceiling per client, one flooder saturates the
# account for everyone — adversarial review (2026-08-04) showed that
# saturation can even be used to game the auth gate's failure handling. A
# person clicking through the app stays far under this; a flood does not.
limit_req_zone $binary_remote_addr zone=hub_gas:10m rate=10r/s;
# /snapshot/notify is auth-free by design (the browser that wrote tells the
# builder) — the rate cap is what keeps an anonymous flood from spending
# rebuild cycles (review 2026-08-05).
limit_req_zone $binary_remote_addr zone=hub_notify:10m rate=2r/s;

# TOP OF web/nginx/default.conf (http level: the file is included inside http{}, beside the existing
# limit_req_zone lines).

# WebSocket upgrade for /chat-hub/ only; every other location keeps its own Connection "".
map $http_upgrade $hub_chat_conn { default upgrade; '' ''; }

# $uri carries no query string, so a ticket (?access_token=) never reaches the log; $request_time gives the
# real lifetime of a connection.
log_format hubchat '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

limit_req_zone $binary_remote_addr zone=hub_chat:10m rate=5r/s;
# the ticket door's own bucket: a whole office behind one address reconnecting after a hub restart
limit_req_zone $binary_remote_addr zone=hub_chat_ticket:10m rate=5r/s;

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # the SPA bundle is megabytes of JavaScript sent on every new version: compressed, it is a
    # fraction of that. Locations below that set their own gzip_types keep them.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain application/manifest+json;

    # Traefik fronts this server, so every request arrives from its
    # container IP — without recovering the real client from
    # X-Forwarded-For, the limiter above would be ONE global bucket and a
    # single flooder would starve every legitimate user (review 2026-08-04).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # hashed build output — immutable.
    #
    # This covers /assets/library/ too, and that is the point: those filenames
    # are content hashes, so the same URL can never mean a different picture.
    # They were being revalidated on every visit — fifty megabytes of images
    # re-fetched to draw a grid that had not changed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The wellbeing illustrations (web/wellbeing-images; the nightly fill was the old platform's
    # app/admin/hub_wellbeing_images.py) — persisted outside the SPA build
    # tree so a frontend deploy cannot wipe them.
    location /wellbeing-images/ {
        alias /srv/wellbeing-images/;
        add_header Cache-Control "public, max-age=86400";
    }

    # ------------------------------------------------------------------
    # Snapshot — reading without the Apps Script queue
    # ------------------------------------------------------------------
    # Every screen used to cost one Apps Script execution, and the web app runs
    # as a single Google account: twenty people reading is twenty people in one
    # queue. The builder writes one file per resource and they are served from
    # here instead — but NOT openly. This host answers on the public internet
    # and every slice holds real people, so each request is checked first.
    #
    # auth_request costs one subrequest to a service that caches the verdict
    # per token: one backend call per person per five minutes, not one per read.
    # The write ledger lives on the same volume but is NOBODY's to read —
    # queued bodies carry session tokens. The gate already refuses names
    # outside the manifest; this makes the refusal unconditional.
    location ^~ /snapshot/write-ledger/ {
        return 404;
    }

    # ------------------------------------------------------------------
    # /snapshot/events — which slice just changed, live
    # ------------------------------------------------------------------
    # EXACT match, and it has to come before the /snapshot/ prefix above, or
    # this falls into `alias /srv/snapshot/` and 404s on a file that does not
    # exist. Same auth_request as every other read: the stream carries resource
    # NAMES, never rows, and the reader still fetches the file through the gate
    # that knows their role.
    #
    # Buffering OFF in both directions — buffered, SSE arrives in a clump or
    # not at all, which is the entire failure this route exists to avoid. The
    # long read timeout is what keeps an idle stream (25s keepalives) from
    # being cut every minute.
    location = /snapshot/events {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $events_host "asa-hub-app:8080";
        proxy_pass http://$events_host/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------
    # /snapshot/chat-stream — a message the moment it is sent
    # ------------------------------------------------------------------
    # EXACT match, and BEFORE the /snapshot/ prefix below for the same reason
    # the events route is: otherwise it falls into `alias /srv/snapshot/` and
    # 404s on a file that does not exist.
    #
    # The relay proxies every /gas call, so it SEES chatSend happen and pushes
    # one line to the recipient's open streams — which is what lets the browser
    # stop asking every twenty seconds, for every signed-in person, forever.
    # What crosses is which conversation and from whom; the words are still
    # fetched through the gated action, exactly as before.
    #
    # Buffering off in both directions, long read timeout: buffered, SSE
    # arrives in a clump or never, and a 25s-keepalive stream must not be cut
    # every minute.
    location = /snapshot/chat-stream {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat_host "asa-hub-app:8080";
        proxy_pass http://$chat_host/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------
    # /snapshot/chat-beat — the heartbeat, answered from memory (2026-08-28)
    # ------------------------------------------------------------------
    # EXACT match, and BEFORE the /snapshot/ prefix for the same reason the two
    # above are: otherwise it falls into `alias /srv/snapshot/` and 404s on a
    # file that does not exist.
    #
    # `chatPing` was 985 of 2,332 browser executions in one day — 42% of what a
    # person's work costs on a backend that runs one execution at a time. This
    # answers the same question from the relay's own memory and tells the
    # browser whether it still owes a real one. A short read timeout on
    # purpose: a beat that has to wait is a beat that should have been skipped.
    location = /snapshot/chat-beat {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $beat_host "asa-hub-app:8080";
        proxy_pass http://$beat_host/chat/beat;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------
    # /cortex/* — the Neural Cortex, through the Hub's own gate (2026-08-18)
    # ------------------------------------------------------------------
    # The Copilot star's chat and the connectome readout. auth_request is the
    # same session gate as every slice (the mesh pair is admin-only there);
    # the relay then speaks to the cortex with the platform's machine
    # credential and the caller's identity spelled out. chat/send is SSE, so
    # buffering is off in both directions and the read timeout outlives a
    # slow turn — a buffered stream is a stream that never arrives.
    location = /cortex/chat/send {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cortex_host "asa-hub-app:8080";
        proxy_pass http://$cortex_host/cortex/chat/send;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store";
    }

    # THE CONVERSATIONS THE CORTEX ALREADY KEPT (2026-08-23).
    #
    # Same session gate as chat/send, because it answers with the CALLER'S own
    # transcripts and the relay resolves who that is from this very token.
    #
    # IT WAS BUILT AND NOT ROUTED, and the failure taught the lesson again: a
    # path with no location falls through to `location /` and is served the
    # SPA's index.html — HTTP 200, content-type text/html. The browser's
    # fetch saw ok=true, res.json() threw on "<!doctype", the catch swallowed
    # it, and the history stayed empty with nothing anywhere reporting a
    # fault. Verified inside the container and never from the domain, which is
    # the only place that counts.
    location ~ ^/cortex/chat/dialogs(/.*)?$ {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dialogs_host "asa-hub-app:8080";
        proxy_pass http://$dialogs_host;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-store";
    }

    # THE VOICE LANE (kill list 2026-09-07, item 2). A clip can be a minute
    # of opus and a synthesis can take as long as a slow turn, so the read
    # timeout matches chat/send; the audio answer is a stream, not a buffer.
    location ~ ^/cortex/chat/voice/(transcribe|speak)$ {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $voice_host "asa-hub-app:8080";
        proxy_pass http://$voice_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 16m;
        add_header Cache-Control "no-store";
    }

    # THE QUO WEBHOOK (2026-08-23) — the half of the door that reads headers.
    #
    # auth_request OFF, and here it is not a convenience: Quo signs the event
    # in a header this location must pass through untouched, and it carries no
    # session because it is a phone system. The relay checks that signature
    # against the three keys in Props.gs and refuses anything it cannot verify,
    # which is the whole reason this path exists rather than Apps Script's.
    location = /quo/webhook {
        auth_request off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $quo_host "asa-hub-app:8080";
        proxy_pass http://$quo_host/quo/webhook;
        proxy_set_header openphone-signature $http_openphone_signature;
        client_max_body_size 4m;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store";
    }

    # THE PLAN READER (2026-08-23). Apps Script posts a client's ISP as bytes
    # and gets back the seventeen fields.
    #
    # auth_request is OFF for the same reason as /analyze below: the caller is
    # Apps Script, which carries no session cookie and authenticates with the
    # service secret INSIDE the body, compared in constant time by the relay.
    # A wrong secret is 401 there; this location only decides who may knock.
    #
    # The body is a whole PDF and the read outlives a forty-three page parse.
    location = /isp/decode {
        auth_request off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $isp_host "asa-hub-app:8080";
        proxy_pass http://$isp_host/isp/decode;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        add_header Cache-Control "no-store";
    }

    # /techdocs/text/<id> — the relay's technology text cache (2026-09-07).
    # Without this location the path fell into the SPA fallback: 200 with
    # index.html as the "document", no auth asked. The relay gates by session
    # itself; auth_request here keeps anonymous knocks out entirely.
    location ~ ^/techdocs/text/[A-Za-z0-9_-]+$ {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $techdocs_host "asa-hub-app:8080";
        proxy_pass http://$techdocs_host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # /digest/try and /digest/shelf — the decoder's laboratory (2026-09-11).
    # The same trap the techdocs note above describes: without a location of
    # its own the path fell into the SPA fallback, the browser was handed
    # index.html where it expected JSON, and the bench showed an empty shelf
    # with no error — a silence that cost an evening. The relay gates by
    # session itself and answers 401/403; auth_request keeps anonymous knocks
    # from reaching it at all. The read timeout is long because the better eye
    # spends real seconds on a photograph.
    location ~ ^/digest/(try|shelf|proposals|proposals/decide|teach)$ {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $digest_host "asa-hub-app:8080";
        proxy_pass http://$digest_host;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store";
    }

    location ~ ^/cortex/(mesh/(graph|live)|health|fleet)$ {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mesh_host "asa-hub-app:8080";
        proxy_pass http://$mesh_host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location /snapshot/ {
        auth_request /__snapshot_auth;
        alias /srv/snapshot/;
        # slices are rebuilt on write; the browser refuses anything older than
        # 15 minutes on its own, so nothing here may be held by a proxy
        add_header Cache-Control "no-store";
        gzip on;
        gzip_types application/json;
        try_files $uri =404;
    }

    # /health — the relay's own pulse, for the Guardian screen (2026-09-05).
    # The SPA's fetch('/health') used to land in the SPA fallback and parse
    # index.html as JSON — a Relay card that could never go green.
    location = /health {
        proxy_pass http://asa-hub-app:8080/health;
        proxy_read_timeout 15s;
    }

    # ------------------------------------------------------------------
    # /gas — the browser's /exec, relayed through our own origin
    # ------------------------------------------------------------------
    # The SPA used to call script.google.com directly; with more than one
    # Google account signed in the browser, the /exec echo resolves against
    # the wrong account index, 404s without CORS headers, and every call —
    # login included — dies (2026-08-04). Same-origin + server-side relay:
    # no Google cookies travel, so the trap cannot exist. The snapshot
    # service does the actual talking (it already speaks /exec for slices).
    location = /gas {
        # burst absorbs a page-load's flurry and a chunked bulk operation;
        # a sustained flood 503s. The relay's own 12-slot semaphore is what
        # actually shields the account — this is the tripwire in front.
        limit_req zone=hub_gas burst=150 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gas_host "asa-hub-app:8080";
        proxy_pass http://$gas_host/gas;
        # the client this server recovered from Traefik, for the relay's guard on the master's sign-in; set here, so
        # whatever a browser sends under this name is replaced
        proxy_set_header X-Real-IP $remote_addr;
        # resume/CJIS uploads ride the same envelope as base64 — the default
        # 1m body cap would cut them off at the door. 40m because base64
        # inflates a file by 4/3 and the urlencoded envelope adds ~6%: the
        # platform's 30MB-per-file ceiling arrives here as ~42MB, and the
        # cap has to sit above what the door itself allows (2026-09-09).
        client_max_body_size 50m;
        # Apps Script executions can legitimately run long (Drive OCR) and a
        # 30MB upload is a long one by nature: 32MB of base64 has to be
        # received, decoded and written to Drive. The engine's own ceiling is
        # six minutes, so 300s here is the widest honest wait — the relay
        # gives such a request 240s and answers before this fires.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # THE COURIER (2026-09-09). Google's front refuses a 30MB anonymous
    # POST, so a big file no longer travels through Apps Script: the engine
    # mints a Drive upload session and the page sends the bytes here in
    # pieces, one at a time, for the relay to hand on. Twelve megabytes is a
    # piece; the whole file never sits in one request.
    location = /upload-chunk {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chunk_host "asa-hub-app:8080";
        proxy_pass http://$chunk_host/upload-chunk;
        proxy_request_buffering off;
        client_max_body_size 12m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # THE DECODER'S ffmpeg ARM (2026-09-09). Apps Script cannot run ffmpeg;
    # this container carries it, tesseract, and a service account that reads
    # the upload folders. The engine calls in with a shared key that lives in
    # a file only the container and the depot know — no session, no cookies,
    # and the only thing it will ever answer about is one file id.
    location = /media-probe {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $probe_host "asa-hub-app:8080";
        proxy_pass http://$probe_host/media-probe;
        client_max_body_size 8k;
        # a clip is downloaded, probed and OCR'd inside the request
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # THE BANG: the whole site's data in one json, assembled per requester's
    # role by the snapshot service (files off the builder's disk — no Apps
    # Script spent). The exact-match location wins over /snapshot/ above.
    location = /snapshot/all.json {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bundle_host "asa-hub-app:8080";
        proxy_pass http://$bundle_host/bundle;
        add_header Cache-Control "no-store";
        gzip on;
        gzip_types application/json;
    }

    # THE PLACE'S OWN BUNDLE (operator, 2026-08-20: "o JSON TAMBEM DEVERIA
    # sanar o problema de lentidao"). all.json above is the COMPANY build and
    # the browser is forbidden to use it inside a world or a franchise, so
    # exactly where he spends his day every read went to Apps Script at five
    # seconds each. The bundles have been built per place for days and nothing
    # served them. The place is verified against the session mirror inside the
    # service — a world id in a query string is a request, not a place.
    location = /snapshot/place {
        auth_request /__snapshot_auth;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $place_host "asa-hub-app:8080";
        proxy_pass http://$place_host/place$is_args$args;
        add_header Cache-Control "no-store";
        gzip on;
        gzip_types application/json;
    }

    # The notify hook: the browser that just wrote tells the builder. Doing it
    # from Apps Script instead would hang a fetch off the end of every save.
    location = /snapshot/notify {
        auth_request off;
        limit_req zone=hub_notify burst=10 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $snapshot_host "asa-hub-app:8080";
        proxy_pass http://$snapshot_host/notify;
    }

    # THE ANALYSIS DOOR (operator, 2026-08-07: "vamos precisar de uma porta
    # aberta com ele" — and he was right hours before this existed).
    #
    # Apps Script asks this when its own model provider will not answer. On the
    # day it was needed the provider was returning 429 with the key in place,
    # the fallback had nowhere to knock, and the log filled with
    # screen_ai_no_fallback while every analysis field stayed empty.
    #
    # auth_request is OFF because the caller is Apps Script, which carries no
    # session cookie — it authenticates with the service secret INSIDE the
    # body, checked by /analyze itself with a constant-time compare. A wrong
    # secret is 401 there; this location only decides who may knock.
    #
    # Rate-limited on purpose: it spends money at a model provider, and an
    # open door that costs money is a door somebody eventually walks through.
    location = /analyze {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $analyze_host "asa-hub-app:8080";
        proxy_pass http://$analyze_host/analyze;
        proxy_read_timeout 180s;
    }

    # The instant half of the phone-call lane: the Apps Script webhook hands
    # each transcript it files straight to the relay, which reads, seals,
    # delivers and rebuilds the two slices in one pass. Same shape as
    # /analyze — the caller is Apps Script carrying the service secret in the
    # body, checked server-side; rate-limited because each call spends a
    # model read. The timeout is generous on purpose: a busy local model can
    # outlast UrlFetchApp, and the work must complete even when the echo is
    # already gone.
    location = /comm-calls/transcript {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $comm_calls_host "asa-hub-app:8080";
        proxy_pass http://$comm_calls_host/comm-calls/transcript;
        proxy_read_timeout 240s;
    }

    # The platform's own mailbox — asa-hub@asaop.org. Same shape as /analyze
    # and for the same reason: the caller is Apps Script carrying the service
    # secret in the body, checked server-side with a constant-time compare.
    # /mail/send is rate-limited because an unmetered door that SENDS MAIL is
    # an open relay the moment any secret ever leaks; /mail/inbox reads only.
    location = /mail/send {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_host "asa-hub-app:8080";
        proxy_pass http://$mail_host/mail/send;
        proxy_read_timeout 60s;
    }
    # /mail/file — the attendance watcher's tidying arm: create the folder,
    # move the report into it. Same service-secret gate as its siblings; the
    # missing route here is why the first live sweep alerted but filed nothing
    # (the call fell into the SPA fallback and came back as index.html, 200).
    location = /mail/file {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_file_host "asa-hub-app:8080";
        proxy_pass http://$mail_file_host/mail/file;
        proxy_read_timeout 60s;
    }
    # /shift/of — one person's shift on one date, for the attendance letter.
    # Service-secret in the body, same gate as the mail doors.
    # /hub-lanes/ — every lane asa-hub-app answers (the house-calendar grid and cell edits, My Work, the inbox, the
    # app packs, the photos, the master's switches…), ONE prefix so the next lane rides free. The app gates every route
    # on the person's own session (Bearer) and the role; this location only decides who may knock.
    location ^~ /hub-lanes/ {
        auth_request off;
        limit_req zone=hub_notify burst=10 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hub_lanes_host "asa-hub-app:8080";
        proxy_pass http://$hub_lanes_host;
        proxy_read_timeout 30s;
    }
    # Scheduling › House calendars' reload: the house calendars' workbook read from Google while the master waits
    # (asa-hub-worker's own budget is 75s, the app's 85s), so it is given longer than the other lanes.
    location = /hub-lanes/scheduling-sheet-reload {
        auth_request off;
        limit_req zone=hub_notify burst=10 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hub_lanes_host "asa-hub-app:8080";
        proxy_pass http://$hub_lanes_host;
        proxy_read_timeout 95s;
    }
    # The same lanes under the name they had before 2026-10-27 (a name only: the app always answered them). A tab
    # still on an older bundle, and any address a record kept, reaches the very same doors until it reloads; a route
    # is never deleted, and each lane stays switchable in the master's Settings › Routes.
    location ^~ /erp-lanes/ {
        auth_request off;
        limit_req zone=hub_notify burst=10 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hub_lanes_host "asa-hub-app:8080";
        rewrite ^/erp-lanes/(.*)$ /hub-lanes/$1 break;
        proxy_pass http://$hub_lanes_host;
        proxy_read_timeout 30s;
    }
    location = /shift/of {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shift_of_host "asa-hub-app:8080";
        proxy_pass http://$shift_of_host/shift/of;
        proxy_read_timeout 60s;
    }
    # /inventory/meds — the pharmacy's own remaining-quantity record
    # (asa_med_deliveries in PG), for the Inventory app. Same body gate.
    location = /inventory/meds {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inv_meds_host "asa-hub-app:8080";
        proxy_pass http://$inv_meds_host/inventory/meds;
        proxy_read_timeout 60s;
    }
    # /inventory/supplies — the procurement catalog (asa_invoice_catalog,
    # purchases only), for the Supplies screen. Same body gate.
    location = /inventory/supplies {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inv_sup_host "asa-hub-app:8080";
        proxy_pass http://$inv_sup_host/inventory/supplies;
        proxy_read_timeout 60s;
    }
    # /finance/* — the old platform's deeper finance sources (analytics rollups, full
    # transaction history, the Finances Drive-folder index) for the Client
    # Finances app. Money never rides an open door: service secret in the
    # body, checked server-side, same as every sibling.
    location ~ ^/finance/(analytics|history|docs)$ {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fin_host "asa-hub-app:8080";
        proxy_pass http://$fin_host;
        proxy_read_timeout 60s;
    }
    # /clients/meds — every client's medications (eMAR + MARS OCR + ISP
    # narrative, real pill photos) for the Medications app. Same body gate.
    location = /clients/meds {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cli_meds_host "asa-hub-app:8080";
        proxy_pass http://$cli_meds_host/clients/meds;
        proxy_read_timeout 60s;
    }
    # /shopper/purchases — the company's priced purchase documents for the
    # Smart Shopper (real receipts beside model estimates). Same body gate.
    location = /shopper/purchases {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shop_host "asa-hub-app:8080";
        proxy_pass http://$shop_host/shopper/purchases;
        proxy_read_timeout 60s;
    }
    # /weather — the public sky over Columbus for calendar cells and widgets.
    # Auth-free (nothing personal in a forecast), rate-limited, cached 30 min
    # inside the relay so the upstream is barely touched.
    location = /weather {
        auth_request off;
        limit_req zone=hub_notify burst=10 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $weather_host "asa-hub-app:8080";
        proxy_pass http://$weather_host/weather;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=600";
    }
    location = /mail/inbox {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_inbox_host "asa-hub-app:8080";
        proxy_pass http://$mail_inbox_host/mail/inbox;
        proxy_read_timeout 60s;
    }

    # THE OTHER FOUR DOORS OF THE SAME MAILBOX (2026-09-14). /mail/inbox and
    # /mail/send have been routed since they were built; opening one message,
    # fetching an attachment, marking read and counting unread never were, so
    # the Mail app could list a mailbox and do nothing else with it. Same
    # shape, same reasons — including the variable upstream, so an absent
    # snapshot container fails these four and nothing else.
    location = /mail/message {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_message_host "asa-hub-app:8080";
        proxy_pass http://$mail_message_host/mail/message;
        proxy_read_timeout 60s;
    }

    location = /mail/attachment {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_attach_host "asa-hub-app:8080";
        proxy_pass http://$mail_attach_host/mail/attachment;
        proxy_read_timeout 120s;
    }

    location = /mail/mark {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_mark_host "asa-hub-app:8080";
        proxy_pass http://$mail_mark_host/mail/mark;
        proxy_read_timeout 60s;
    }

    location = /mail/unread {
        auth_request off;
        limit_req zone=hub_notify burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mail_unread_host "asa-hub-app:8080";
        proxy_pass http://$mail_unread_host/mail/unread;
        proxy_read_timeout 60s;
    }

    # NOTE the variable in proxy_pass, and it is not style.
    #
    # A literal upstream is resolved when nginx STARTS, so a missing snapshot
    # container would stop this server from starting at all — the whole Hub
    # down because an accelerator was absent. Through a variable the name is
    # resolved per request: no snapshot service means these two locations fail
    # and every other path is untouched. The browser reads that failure as
    # "no slice" and goes to the live path, which is where it was before.
    location = /__snapshot_auth {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        # the slice gate on asa-hub-app's own verdicts (app/front_door.py gate); back: asa-hub-snapshot:8080
        set $auth_host "asa-hub-app:8080";
        proxy_pass http://$auth_host/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # everything else falls back to the SPA shell, always revalidated
    # THE MANIFESTS ARE NOT PUBLIC (2026-08-06). Both are read off the disk
    # by the server processes — the snapshot builder via HUB_SNAPSHOT_MANIFEST
    # and the relay via HUB_RESOLVER_MANIFEST, both /srv/web/… — and nothing
    # in the SPA fetches either one over HTTP (checked, not assumed). Served
    # at the web root they were a free map of the API surface to anyone who
    # asked: 109 action names, the file each lives in, and the roles each one
    # requires. It grants no access — every role is enforced server-side —
    # but reconnaissance handed out for nothing is still handed out.
    location ~ ^/(snapshot|resolver)-manifest\.json$ {
        deny all;
    }

    # INSIDE the server{} block of platform-assets/hub-nginx.conf, beside /snapshot/chat-stream and BEFORE the SPA's
    # catch-all `location /`. The hub's location is a regex one: no regex location already in the file matches its
    # two paths, and no `^~` prefix location covers /chat-hub/.

    # The ticket door: behind the same gate as every relay door (the relay names /snapshot/chat-ticket in
    # _role_may_read). The Authorization and X-Hub-Tenant headers pass through as sent. Its own bucket
    # (hub_chat_ticket), not /snapshot/notify's: people behind one office address share a bucket, and a reconnect
    # after a hub restart must not spend the notify calls every /gas write makes. Every mint asks App Control, and
    # a session minting in a loop only displaces its own tickets.
    location = /snapshot/chat-ticket {
        auth_request /__snapshot_auth;
        limit_req zone=hub_chat_ticket burst=30 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $x_host "asa-hub-app:8080";
        proxy_pass http://$x_host/chat/ticket;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # The hub. No auth_request on purpose: the hub redeems the ticket, which was itself issued behind /auth, and
    # a WebSocket cannot carry the Authorization header /auth reads.
    #
    # ONLY THE HUB'S TWO PATHS, AND ONLY AS NGINX NORMALISED THEM. The location matches the decoded, dot-resolved
    # $uri against the connection path and its negotiate, and proxy_pass sends the path it names itself — never the
    # client's raw request line, nor even $uri — with the query as it came (negotiateVersion, id, access_token). A raw
    # line such as /chat-hub/a%2Fb/../../internal/event is normalised here to something that is not one of the two
    # paths, so it falls through to the SPA; the hub's /internal/* and /health are never reached from outside,
    # whatever Kestrel would make of the raw line.
    #
    # THE END OF THE PATH IS THE END OF THE STRING. `$` in PCRE also matches before a final newline, so
    # /chat-hub/live%0A would match `...$` and, forwarded as $uri, put a bare LF into the upstream request line. `\z`
    # matches only at the very end: a decoded CR or LF anywhere makes it not one of the two paths.
    #
    # THE QUERY NEVER REACHES A LOG. The access log is `hubchat` ($uri, no query). The error log is the one nginx
    # writes the whole request line to — limit_req rejections, and upstream connect failures while the hub restarts
    # ("request: \"GET /chat-hub/live?id=...&access_token=...\"") — so for this location it keeps `crit` and above
    # only, and the rejections themselves are logged a level below that.
    location ~ ^/chat-hub/live(?<chat_hub_tail>/negotiate)?\z {
        access_log /var/log/nginx/access.log hubchat;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=hub_chat burst=40 nodelay;
        limit_req_log_level warn;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat_hub "asa-hub-chat:8080";
        proxy_pass http://$chat_hub/chat-hub/live$chat_hub_tail$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hub_chat_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64k;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
